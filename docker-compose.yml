version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: ai-rag-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: ai-rag-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
